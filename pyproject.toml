[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-code"
version = "0.1.0"
description = "Style-aware code generation agent using a local CodeLlama model via Ricky MCP"
requires-python = ">=3.10"
dependencies = ["requests"]

[project.scripts]
my-code = "my_code.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["my_code*"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
all = ["anthropic>=0.40", "openai>=1.0"]
